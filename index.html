<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3 Pre-signed URL Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="page">

  <!-- ── Header ── -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.35 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <div>
          <h1>S3 Pre-signed URL</h1>
          <p>Lab Demo</p>
        </div>
      </div>
      <div class="aws-badge">
        <span class="dot"></span>
        AWS Lambda · API Gateway · S3
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ── Tabs ── -->
    <div class="tabs">
      <button class="tab active" data-tab="download" onclick="switchTab('download')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
      <button class="tab" data-tab="upload" onclick="switchTab('upload')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload
      </button>
    </div>

    <!-- ════════ DOWNLOAD PANEL ════════ -->
    <div class="panel" id="panel-download">

      <!-- Input form -->
      <div class="form-card">
        <div class="field">
          <label>API Gateway URL</label>
          <input type="text" id="dl-api" placeholder="https://xxxxxxxxxx.execute-api.region.amazonaws.com/prod/presign/download" autocomplete="off" />
        </div>
        <div class="field">
          <label>S3 Object Key</label>
          <input type="text" id="dl-key" placeholder="folder/photo.jpg" autocomplete="off" />
        </div>
        <button class="btn-primary" id="dl-btn" onclick="doDownload()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Get Pre-signed URL
        </button>
        <div class="error-msg" id="dl-error"></div>
      </div>

      <!-- Result -->
      <div class="result-panel" id="dl-result">

        <div class="result-header">
          <div class="result-title">
            <span class="status-dot green"></span>
            Pre-signed URL Generated
          </div>
          <div class="result-actions">
            <button class="chip" onclick="copyText('dl-url-box')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy URL
            </button>
            <button class="chip chip-blue" onclick="triggerDownload()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download File
            </button>
          </div>
        </div>

        <!-- URL box -->
        <div class="url-box">
          <textarea id="dl-url-box" readonly></textarea>
        </div>

        <!-- Metadata grid -->
        <div class="meta-grid" id="dl-meta"></div>

      </div>
    </div>

    <!-- ════════ UPLOAD PANEL ════════ -->
    <div class="panel hidden" id="panel-upload">

      <!-- Input form -->
      <div class="form-card">
        <div class="field">
          <label>API Gateway URL</label>
          <input type="text" id="ul-api" placeholder="https://xxxxxxxxxx.execute-api.region.amazonaws.com/prod/presign/upload" autocomplete="off" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>S3 Object Key</label>
            <input type="text" id="ul-key" placeholder="uploads/myfile.jpg" autocomplete="off" />
          </div>
          <div class="field field-sm">
            <label>Content-Type</label>
            <select id="ul-ct">
              <option value="image/jpeg">image/jpeg</option>
              <option value="image/png">image/png</option>
              <option value="application/pdf">application/pdf</option>
              <option value="text/plain">text/plain</option>
              <option value="application/octet-stream">application/octet-stream</option>
            </select>
          </div>
        </div>
        <button class="btn-primary btn-green" id="ul-btn" onclick="doUpload()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Get Pre-signed URL
        </button>
        <div class="error-msg" id="ul-error"></div>
      </div>

      <!-- Result -->
      <div class="result-panel" id="ul-result">

        <div class="result-header">
          <div class="result-title">
            <span class="status-dot green"></span>
            Pre-signed URL Generated
          </div>
          <button class="chip" onclick="copyText('ul-url-box')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy URL
          </button>
        </div>

        <div class="url-box">
          <textarea id="ul-url-box" readonly></textarea>
        </div>

        <div class="meta-grid" id="ul-meta"></div>

        <!-- File upload -->
        <div class="upload-section">
          <div class="section-label">Upload File to S3</div>
          <label class="drop-zone" id="drop-zone">
            <input type="file" id="ul-file" onchange="onFileChange(event)" />
            <div class="drop-inner" id="drop-inner">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="drop-text">Click or drag file here</span>
            </div>
          </label>

          <button class="btn-primary btn-orange" id="ul-send-btn" disabled onclick="sendUpload()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Upload to S3
          </button>

          <div class="progress-row" id="progress-row" style="display:none">
            <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
            <span id="progress-pct">0%</span>
          </div>

          <div id="ul-status"></div>
        </div>

        <!-- Postman hint -->
        <div class="hint-box">
          <span class="hint-label">Postman</span>
          Method <code>PUT</code> · paste URL · Header <code>Content-Type: <span id="ul-ct-hint"></span></code> · Body → binary → choose file · Send
        </div>

      </div>
    </div>

    <!-- ── Raw response log ── -->
    <div class="log-wrap">
      <div class="log-top">
        <span class="log-title">Raw API Response</span>
        <button class="chip" onclick="clearLog()">Clear</button>
      </div>
      <pre id="log-body" class="log-pre">— no requests yet —</pre>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
